name: 🐛 Bug Report
description: Laporkan bug atau perilaku tak terduga pada Wazeko
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih telah melaporkan bug! Pastikan Anda sudah menjalankan versi terbaru dan memeriksa [dokumentasi](https://muhammadlutfimuzakiivy.github.io/Wazeko/).
  - type: input
    id: version
    attributes:
      label: Versi Wazeko & Node.js
      description: Sebutkan versi Wazeko dan Node.js yang Anda gunakan (contoh: Wazeko v1.0.0, Node.js v20.11.0).
      placeholder: "Wazeko v1.0.0, Node.js v20.x"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistem Operasi
      options:
        - Linux (Ubuntu/Debian)
        - Linux (Alpine/Docker)
        - Windows
        - macOS
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Deskripsi Masalah
      description: Jelaskan secara singkat dan jelas apa bug yang terjadi.
      placeholder: "Sesi terputus saat..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Langkah-Langkah Reproduksi
      description: Langkah-langkah untuk memicu bug tersebut.
      placeholder: |
        1. Inisialisasi client dengan AtomicFileAuthStore
        2. Jalankan client.connect()
        3. Panggil client.sendMessage(...)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs / Stacktrace
      description: Lampirkan output error atau log JSON dari StructuredLogger.
      render: shell
      placeholder: "Tempelkan log error di sini"
